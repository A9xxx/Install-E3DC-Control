  b1a_candidate:
    name: B1a - build and verify candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      candidate_digest: ${{ steps.verified.outputs.candidate_digest }}
    steps:
      - name: Checkout exact approved release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          path: release
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout verifier from workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false
      - name: Bind release source and verifier
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA" ]
          [ "$(git -C verifier rev-parse HEAD)" = "$WORKFLOW_SHA" ]
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify advertised rollback images
        if: ${{ inputs.release_tag != 'v5.3.2b' }}
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          mapfile -t rollback_bindings < <(python3 -c 'import json; policy=json.load(open("UPDATE_POLICY.json", encoding="utf-8")); print("\n".join(str(item.get("docker_image") or "").strip()+"\t"+str(item.get("docker_index_digest") or "").strip() for item in policy.get("rollback_releases", []) if isinstance(item, dict) and item.get("docker_supported") is True))')
          [ "${#rollback_bindings[@]}" -gt 0 ]
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          n=0
          for binding in "${rollback_bindings[@]}"; do
            IFS=$'\t' read -r image expected_digest <<<"$binding"
            [[ "$image" =~ ^ghcr\.io/a9xxx/install-e3dc-control:v[0-9A-Za-z._-]+$ ]]
            if [ -z "$expected_digest" ]; then
              [ "$image" = "$ROLLBACK_ROOT_IMAGE" ]
              expected_digest="$ROLLBACK_ROOT_INDEX_DIGEST"
            fi
            [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            raw_file="$tmpdir/index-$n.json"
            docker buildx imagetools inspect --raw "$image" > "$raw_file"
            actual_digest="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
            [ "$actual_digest" = "$expected_digest" ]
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("mediaType") in {"application/vnd.oci.image.index.v1+json","application/vnd.docker.distribution.manifest.list.v2+json"}; found={str(item.get("platform",{}).get("os"))+"/"+str(item.get("platform",{}).get("architecture")) for item in data.get("manifests",[])}; missing=sorted({"linux/amd64","linux/arm64"}-found); assert not missing, "fehlende Plattformen: "+", ".join(missing)' < "$raw_file"
            n=$((n + 1))
          done
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate digest only
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: https://github.com/${{ github.repository }}.git#${{ inputs.release_sha }}
          file: Dockerfile
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.validate.outputs.image }}:candidate-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/A9xxx/Install-E3DC-Control
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ inputs.release_sha }}
            org.opencontainers.image.created=${{ inputs.created }}
            io.e3dc.git.tree=${{ inputs.release_tree }}
            io.e3dc.source.manifest=${{ inputs.source_manifest_sha256 }}
          build-args: |
            E3DC_VERSION=${{ needs.validate.outputs.version }}
            E3DC_REVISION=${{ inputs.release_sha }}
            E3DC_TREE=${{ inputs.release_tree }}
            E3DC_CREATED=${{ inputs.created }}
            E3DC_SOURCE_MANIFEST=${{ inputs.source_manifest_sha256 }}
          sbom: true
          provenance: mode=max
      - name: Smoke-test real container startup
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE}@${CANDIDATE_DIGEST}"
          name="e3dc-release-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          log_file="$(mktemp)"
          cleanup() {
            docker logs "$name" > "$log_file" 2>&1 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            if [ "${1:-0}" != "0" ]; then
              sed -n '1,240p' "$log_file" >&2
            fi
            rm -f "$log_file"
          }
          trap 'cleanup $?' EXIT
          docker pull --platform linux/amd64 "$reference"
          docker run -d --name "$name" \
            --platform linux/amd64 \
            --tmpfs /var/www/html/ramdisk:uid=33,gid=33,mode=2775,size=32m \
            "$reference" >/dev/null
          ready=0
          for _ in $(seq 1 60); do
            docker logs "$name" > "$log_file" 2>&1 || true
            if grep -Fq 'run_config_wizard hat keinen erfolgreichen Abschluss gemeldet.' "$log_file" \
              || grep -Fq 'FEHLER: Konfigurationsmigration oder Docker-Standalone-Guard fehlgeschlagen.' "$log_file"; then
              exit 1
            fi
            if grep -Fq -- '-> Starte fail-closed Logrotation für persistente Produktlogs...' "$log_file"; then
              ready=1
              break
            fi
            [ "$(docker inspect --format '{{.State.Running}}' "$name")" = true ]
            sleep 1
          done
          [ "$ready" = 1 ]
          [ "$(docker inspect --format '{{.State.Running}}' "$name")" = true ]
      - name: Verify candidate before any stable tag exists
        id: verified
        shell: bash
        working-directory: verifier
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash .github/scripts/verify-oci-release.sh \
            "${{ needs.validate.outputs.image }}" "$CANDIDATE_DIGEST" \
            "${{ inputs.release_sha }}" "${{ inputs.release_tree }}" \
            "${{ needs.validate.outputs.version }}" "${{ inputs.created }}" \
            "${{ inputs.source_manifest_sha256 }}"
          echo "candidate_digest=$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"

  b1b_promote:
    name: B1b - reverify and promote digest
    needs: [validate, b1a_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact approved release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          path: release
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout verifier from workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false
      - name: Bind release source and verifier
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA" ]
          [ "$(git -C verifier rev-parse HEAD)" = "$WORKFLOW_SHA" ]
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify advertised rollback images
        if: ${{ inputs.release_tag != 'v5.3.2b' }}
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          mapfile -t rollback_bindings < <(python3 -c 'import json; policy=json.load(open("UPDATE_POLICY.json", encoding="utf-8")); print("\n".join(str(item.get("docker_image") or "").strip()+"\t"+str(item.get("docker_index_digest") or "").strip() for item in policy.get("rollback_releases", []) if isinstance(item, dict) and item.get("docker_supported") is True))')
          [ "${#rollback_bindings[@]}" -gt 0 ]
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          n=0
          for binding in "${rollback_bindings[@]}"; do
            IFS=$'\t' read -r image expected_digest <<<"$binding"
            [[ "$image" =~ ^ghcr\.io/a9xxx/install-e3dc-control:v[0-9A-Za-z._-]+$ ]]
            if [ -z "$expected_digest" ]; then
              [ "$image" = "$ROLLBACK_ROOT_IMAGE" ]
              expected_digest="$ROLLBACK_ROOT_INDEX_DIGEST"
            fi
            [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            raw_file="$tmpdir/index-$n.json"
            docker buildx imagetools inspect --raw "$image" > "$raw_file"
            actual_digest="sha256:$(sha256sum "$raw_file" | awk '{print $1}')"
            [ "$actual_digest" = "$expected_digest" ]
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("mediaType") in {"application/vnd.oci.image.index.v1+json","application/vnd.docker.distribution.manifest.list.v2+json"}; found={str(item.get("platform",{}).get("os"))+"/"+str(item.get("platform",{}).get("architecture")) for item in data.get("manifests",[])}; missing=sorted({"linux/amd64","linux/arm64"}-found); assert not missing, "fehlende Plattformen: "+", ".join(missing)' < "$raw_file"
            n=$((n + 1))
          done
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reverify immutable candidate digest
        shell: bash
        working-directory: verifier
        env:
          CANDIDATE_DIGEST: ${{ needs.b1a_candidate.outputs.candidate_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash .github/scripts/verify-oci-release.sh \
            "${{ needs.validate.outputs.image }}" "$CANDIDATE_DIGEST" \
            "${{ inputs.release_sha }}" "${{ inputs.release_tree }}" \
            "${{ needs.validate.outputs.version }}" "${{ inputs.created }}" \
            "${{ inputs.source_manifest_sha256 }}"
      - name: Promote verified digest to stable version tags
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ needs.b1a_candidate.outputs.candidate_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image="${{ needs.validate.outputs.image }}"
          digest="$CANDIDATE_DIGEST"
          version="${{ needs.validate.outputs.version }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          verify_immutable_tag() {
            local ref="$1"
            local inspect_output
            local inspect_status
            local current_digest
            set +e
            inspect_output="$(docker buildx imagetools inspect "$ref" 2>&1)"
            inspect_status=$?
            set -e
            if [ "$inspect_status" -eq 0 ]; then
              current_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"$inspect_output")"
              [ -n "$current_digest" ]
              if [ "$current_digest" != "$digest" ]; then
                echo "Unveränderlicher Release-Tag $ref zeigt bereits auf $current_digest statt $digest." >&2
                exit 1
              fi
              return 0
            fi
            if grep -Eqi 'manifest unknown|unexpected status[^[:cntrl:]]*404|404[[:space:]]+not found|(^|[[:space:]:])not found([[:space:]]|$)' <<<"$inspect_output"; then
              return 0
            fi
            printf '%s\n' "$inspect_output" >&2
            exit "$inspect_status"
          }

          verify_immutable_tag "${image}:${RELEASE_TAG}"
          verify_immutable_tag "${image}:${version}"
          docker buildx imagetools create --tag "${image}:${RELEASE_TAG}" "${image}@${digest}"
          docker buildx imagetools create --tag "${image}:${version}" "${image}@${digest}"
          [ "$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" | awk '$1 == "Digest:" {print $2; exit}')" = "$digest" ]
          [ "$(docker buildx imagetools inspect "${image}:${version}" | awk '$1 == "Digest:" {print $2; exit}')" = "$digest" ]
          if [ "$RELEASE_TAG" = "v5.4.4" ]; then
            docker buildx imagetools create --tag "${image}:latest" "${image}@${digest}"
            [ "$(docker buildx imagetools inspect "${image}:latest" | awk '$1 == "Digest:" {print $2; exit}')" = "$digest" ]
          fi
