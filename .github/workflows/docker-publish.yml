name: Build and promote verified release images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact approved release tag"
        required: true
        type: choice
        options: [v5.3.2b, v5.4.0, v5.4.0a, v5.4.0b, v5.4.0c, v5.4.0d, v5.4.0e, v5.4.1, v5.4.1a, v5.4.1b, v5.4.1c, v5.4.1d, v5.4.2, v5.4.2a, v5.4.2b, v5.4.2c, v5.4.2d, v5.4.3, v5.4.3d, v5.4.3e, v5.4.3f, v5.4.3g, v5.4.3h, v5.4.3i, v5.4.3j, v5.4.3k, v5.4.3l, v5.4.3m, v5.4.3n, v5.4.3o, v5.4.3p, v5.4.3q, v5.4.3r, v5.4.3s, v5.4.4]
      release_sha:
        description: "Approved 40-hex release commit"
        required: true
        type: string
      release_tree:
        description: "Approved 40-hex tree"
        required: true
        type: string
      root_sha:
        description: "Exact parentless R0 commit"
        required: true
        type: string
      root_tree:
        description: "Exact parentless R0 tree"
        required: true
        type: string
      created:
        description: "Approved UTC OCI created timestamp"
        required: true
        type: string
      source_manifest_sha256:
        description: "SHA-256 of the approved public source manifest"
        required: true
        type: string

concurrency:
  group: e3dc-release-b1-transaction
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  ROLLBACK_ROOT_IMAGE: ghcr.io/a9xxx/install-e3dc-control:v5.3.2b
  ROLLBACK_ROOT_INDEX_DIGEST: sha256:da1a42846004249dc45d9848e91af9ea10b1c40a51c9f88fa2e2fec0de2fc35a

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Validate exact release identity and topology
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TREE: ${{ inputs.release_tree }}
          ROOT_SHA: ${{ inputs.root_sha }}
          ROOT_TREE: ${{ inputs.root_tree }}
          CREATED: ${{ inputs.created }}
          SOURCE_MANIFEST: ${{ inputs.source_manifest_sha256 }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROOT_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          [ "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE" ]
          [ "$(tr -d '[:space:]' < VERSION)" = "${RELEASE_TAG#v}" ]
          python3 - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          policy = json.loads(Path("UPDATE_POLICY.json").read_text(encoding="utf-8"))
          assert policy.get("version") == version, "UPDATE_POLICY.version passt nicht zum Release-Tag"
          assert policy.get("stable_release") == tag, "UPDATE_POLICY.stable_release passt nicht zum Release-Tag"
          module = ast.parse(Path("Installer/__init__.py").read_text(encoding="utf-8"))
          installer_versions = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              )
          ]
          assert installer_versions == [version], "Installer.__version__ passt nicht zum Release-Tag"
          if tag in {"v5.4.2", "v5.4.2a", "v5.4.2b", "v5.4.2c", "v5.4.2d", "v5.4.3", "v5.4.3d", "v5.4.3e", "v5.4.3f", "v5.4.3g", "v5.4.3h", "v5.4.3i", "v5.4.3j", "v5.4.3k", "v5.4.3l", "v5.4.3m", "v5.4.3n", "v5.4.3o", "v5.4.3p", "v5.4.3q", "v5.4.3r", "v5.4.3s", "v5.4.4"}:
              matches = [
                  item
                  for item in policy.get("rollback_releases", [])
                  if isinstance(item, dict)
                  and item.get("docker_supported") is True
                  and item.get("docker_image") == os.environ["ROLLBACK_ROOT_IMAGE"]
              ]
              assert len(matches) == 1, f"{tag} muss genau den gebundenen Docker-Rollback-Root enthalten"
              assert (
                  matches[0].get("docker_index_digest")
                  == os.environ["ROLLBACK_ROOT_INDEX_DIGEST"]
              ), "Rollback-OCI-Digest weicht ab"
          PY
          [ "$(git show -s --format='%an|%ae|%cn|%ce' HEAD)" = "A9x|169547159+A9xxx@users.noreply.github.com|A9x|169547159+A9xxx@users.noreply.github.com" ]
          if [ "$RELEASE_TAG" = "v5.3.2b" ]; then
            [ "$RELEASE_SHA" = "$ROOT_SHA" ]
            [ "$RELEASE_TREE" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "$ROOT_SHA" ]
            [ "$(git rev-parse HEAD^^{tree})" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0a" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD^^)" = "$ROOT_SHA" ]
