name: Build and promote verified release images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact approved release tag"
        required: true
        type: choice
        options: [v5.3.2b, v5.4.0, v5.4.0a, v5.4.0b, v5.4.0c, v5.4.0d, v5.4.0e, v5.4.1, v5.4.1a]
      release_sha:
        description: "Approved 40-hex release commit"
        required: true
        type: string
      release_tree:
        description: "Approved 40-hex tree"
        required: true
        type: string
      root_sha:
        description: "Exact parentless R0 commit"
        required: true
        type: string
      root_tree:
        description: "Exact parentless R0 tree"
        required: true
        type: string
      created:
        description: "Approved UTC OCI created timestamp"
        required: true
        type: string
      source_manifest_sha256:
        description: "SHA-256 of the approved public source manifest"
        required: true
        type: string

concurrency:
  group: e3dc-release-b1-transaction
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 8
          fetch-tags: false
          persist-credentials: false
      - name: Validate exact release identity and topology
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TREE: ${{ inputs.release_tree }}
          ROOT_SHA: ${{ inputs.root_sha }}
          ROOT_TREE: ${{ inputs.root_tree }}
          CREATED: ${{ inputs.created }}
          SOURCE_MANIFEST: ${{ inputs.source_manifest_sha256 }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROOT_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          [ "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE" ]
          [ "$(tr -d '[:space:]' < VERSION)" = "${RELEASE_TAG#v}" ]
          [ "$(git show -s --format='%an|%ae|%cn|%ce' HEAD)" = "A9x|169547159+A9xxx@users.noreply.github.com|A9x|169547159+A9xxx@users.noreply.github.com" ]
          if [ "$RELEASE_TAG" = "v5.3.2b" ]; then
            [ "$RELEASE_SHA" = "$ROOT_SHA" ]
            [ "$RELEASE_TREE" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "$ROOT_SHA" ]
            [ "$(git rev-parse HEAD^^{tree})" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0a" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD^^)" = "$ROOT_SHA" ]
            [ "$(git rev-parse HEAD^^^{tree})" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0b" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "6e4660379c5fcc6849e6b76f49fc4bd727273aa5" ]
            [ "$(git rev-parse HEAD^^)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD^^^)" = "$ROOT_SHA" ]
            [ "$(git rev-parse HEAD^^^^{tree})" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0c" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "6a1b24c7865b2bbc1c5d21d69b7c73553a0de78e" ]
            [ "$(git rev-parse HEAD^^)" = "6e4660379c5fcc6849e6b76f49fc4bd727273aa5" ]
            [ "$(git rev-parse HEAD^^^)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD^^^^)" = "$ROOT_SHA" ]
            [ "$(git rev-parse HEAD^^^^^{tree})" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0d" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "a251ba9c346ec227c6ac4785945479fd25cb8839" ]
            [ "$(git rev-parse HEAD^^)" = "6a1b24c7865b2bbc1c5d21d69b7c73553a0de78e" ]
            [ "$(git rev-parse HEAD^^^)" = "6e4660379c5fcc6849e6b76f49fc4bd727273aa5" ]
            [ "$(git rev-parse HEAD^^^^)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD^^^^^)" = "$ROOT_SHA" ]
            [ "$(git rev-parse 'HEAD~5^{tree}')" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.0e" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "2bad44d80ff24775d8f4e8ff0e99dd07aa516be0" ]
            [ "$(git rev-parse HEAD^^)" = "a251ba9c346ec227c6ac4785945479fd25cb8839" ]
            [ "$(git rev-parse HEAD^^^)" = "6a1b24c7865b2bbc1c5d21d69b7c73553a0de78e" ]
            [ "$(git rev-parse HEAD^^^^)" = "6e4660379c5fcc6849e6b76f49fc4bd727273aa5" ]
            [ "$(git rev-parse HEAD^^^^^)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD~6)" = "$ROOT_SHA" ]
            [ "$(git rev-parse 'HEAD~6^{tree}')" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.1" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD~5 | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD~6 | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "f65fb584c7d01a721c41d863f59a140de49be8a1" ]
            [ "$(git rev-parse HEAD^^)" = "2bad44d80ff24775d8f4e8ff0e99dd07aa516be0" ]
            [ "$(git rev-parse HEAD^^^)" = "a251ba9c346ec227c6ac4785945479fd25cb8839" ]
            [ "$(git rev-parse HEAD^^^^)" = "6a1b24c7865b2bbc1c5d21d69b7c73553a0de78e" ]
            [ "$(git rev-parse HEAD~5)" = "6e4660379c5fcc6849e6b76f49fc4bd727273aa5" ]
            [ "$(git rev-parse HEAD~6)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD~7)" = "$ROOT_SHA" ]
            [ "$(git rev-parse 'HEAD~7^{tree}')" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          elif [ "$RELEASE_TAG" = "v5.4.1a" ]; then
            [ "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD^^^^ | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD~5 | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD~6 | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-list --parents -n 1 HEAD~7 | awk '{print NF-1}')" -eq 1 ]
            [ "$(git rev-parse HEAD^)" = "908464b640dfdae066e9022f56d994689df15eb3" ]
            [ "$(git rev-parse HEAD^^)" = "f65fb584c7d01a721c41d863f59a140de49be8a1" ]
            [ "$(git rev-parse HEAD^^^)" = "2bad44d80ff24775d8f4e8ff0e99dd07aa516be0" ]
            [ "$(git rev-parse HEAD^^^^)" = "a251ba9c346ec227c6ac4785945479fd25cb8839" ]
            [ "$(git rev-parse HEAD~5)" = "6a1b24c7865b2bbc1c5d21d69b7c73553a0de78e" ]
            [ "$(git rev-parse HEAD~6)" = "6e4660379c5fcc6849e6b76f49fc4bd727273aa5" ]
            [ "$(git rev-parse HEAD~7)" = "59e5907d1b517cf04e60611ae6e7765c184b00f8" ]
            [ "$(git rev-parse HEAD~8)" = "$ROOT_SHA" ]
            [ "$(git rev-parse 'HEAD~8^{tree}')" = "$ROOT_TREE" ]
            [ "$(git rev-list --parents -n 1 "$ROOT_SHA" | awk '{print NF-1}')" -eq 0 ]
          else
            exit 1
          fi
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"

  b1a_candidate:
    name: B1a - build and verify candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      candidate_digest: ${{ steps.verified.outputs.candidate_digest }}
    steps:
      - name: Checkout exact approved release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          path: release
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout verifier from workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false
      - name: Bind release source and verifier
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA" ]
          [ "$(git -C verifier rev-parse HEAD)" = "$WORKFLOW_SHA" ]
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify advertised rollback images
        if: ${{ inputs.release_tag != 'v5.3.2b' }}
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          mapfile -t rollback_images < <(python3 -c 'import json; policy=json.load(open("UPDATE_POLICY.json", encoding="utf-8")); print("\n".join(str(item.get("docker_image") or "").strip() for item in policy.get("rollback_releases", []) if isinstance(item, dict) and item.get("docker_supported") is True))')
          [ "${#rollback_images[@]}" -gt 0 ]
          for image in "${rollback_images[@]}"; do
            [[ "$image" =~ ^ghcr\.io/a9xxx/install-e3dc-control:v[0-9A-Za-z._-]+$ ]]
            raw="$(docker buildx imagetools inspect --raw "$image")"
            python3 -c 'import json, sys; data=json.load(sys.stdin); found={str(item.get("platform", {}).get("os"))+"/"+str(item.get("platform", {}).get("architecture")) for item in data.get("manifests", [])}; required={"linux/amd64", "linux/arm64"}; missing=sorted(required-found); assert not missing, "fehlende Plattformen: "+", ".join(missing)' <<<"$raw"
          done
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate digest only
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: https://github.com/${{ github.repository }}.git#${{ inputs.release_sha }}
          file: Dockerfile
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.validate.outputs.image }}:candidate-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/A9xxx/Install-E3DC-Control
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ inputs.release_sha }}
            org.opencontainers.image.created=${{ inputs.created }}
            io.e3dc.git.tree=${{ inputs.release_tree }}
            io.e3dc.source.manifest=${{ inputs.source_manifest_sha256 }}
          build-args: |
            E3DC_VERSION=${{ needs.validate.outputs.version }}
            E3DC_REVISION=${{ inputs.release_sha }}
            E3DC_TREE=${{ inputs.release_tree }}
            E3DC_CREATED=${{ inputs.created }}
            E3DC_SOURCE_MANIFEST=${{ inputs.source_manifest_sha256 }}
          sbom: true
          provenance: mode=max
      - name: Verify candidate before any stable tag exists
        id: verified
        shell: bash
        working-directory: verifier
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash .github/scripts/verify-oci-release.sh \
            "${{ needs.validate.outputs.image }}" "$CANDIDATE_DIGEST" \
            "${{ inputs.release_sha }}" "${{ inputs.release_tree }}" \
            "${{ needs.validate.outputs.version }}" "${{ inputs.created }}" \
            "${{ inputs.source_manifest_sha256 }}"
          echo "candidate_digest=$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"

  b1b_promote:
    name: B1b - reverify and promote digest
    needs: [validate, b1a_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact approved release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          path: release
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout verifier from workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false
      - name: Bind release source and verifier
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA" ]
          [ "$(git -C verifier rev-parse HEAD)" = "$WORKFLOW_SHA" ]
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify advertised rollback images
        if: ${{ inputs.release_tag != 'v5.3.2b' }}
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          mapfile -t rollback_images < <(python3 -c 'import json; policy=json.load(open("UPDATE_POLICY.json", encoding="utf-8")); print("\n".join(str(item.get("docker_image") or "").strip() for item in policy.get("rollback_releases", []) if isinstance(item, dict) and item.get("docker_supported") is True))')
          [ "${#rollback_images[@]}" -gt 0 ]
          for image in "${rollback_images[@]}"; do
            [[ "$image" =~ ^ghcr\.io/a9xxx/install-e3dc-control:v[0-9A-Za-z._-]+$ ]]
            raw="$(docker buildx imagetools inspect --raw "$image")"
            python3 -c 'import json, sys; data=json.load(sys.stdin); found={str(item.get("platform", {}).get("os"))+"/"+str(item.get("platform", {}).get("architecture")) for item in data.get("manifests", [])}; required={"linux/amd64", "linux/arm64"}; missing=sorted(required-found); assert not missing, "fehlende Plattformen: "+", ".join(missing)' <<<"$raw"
          done
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reverify immutable candidate digest
        shell: bash
        working-directory: verifier
        env:
          CANDIDATE_DIGEST: ${{ needs.b1a_candidate.outputs.candidate_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash .github/scripts/verify-oci-release.sh \
            "${{ needs.validate.outputs.image }}" "$CANDIDATE_DIGEST" \
            "${{ inputs.release_sha }}" "${{ inputs.release_tree }}" \
            "${{ needs.validate.outputs.version }}" "${{ inputs.created }}" \
            "${{ inputs.source_manifest_sha256 }}"
      - name: Promote verified digest to stable version tags
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ needs.b1a_candidate.outputs.candidate_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image="${{ needs.validate.outputs.image }}"
          digest="$CANDIDATE_DIGEST"
          version="${{ needs.validate.outputs.version }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          verify_immutable_tag() {
            local ref="$1"
            local inspect_output
            local inspect_status
            local current_digest
            set +e
            inspect_output="$(docker buildx imagetools inspect "$ref" 2>&1)"
            inspect_status=$?
            set -e
            if [ "$inspect_status" -eq 0 ]; then
              current_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"$inspect_output")"
              [ -n "$current_digest" ]
              if [ "$current_digest" != "$digest" ]; then
                echo "Unveränderlicher Release-Tag $ref zeigt bereits auf $current_digest statt $digest." >&2
                exit 1
              fi
              return 0
            fi
            if grep -Eqi 'manifest unknown|unexpected status[^[:cntrl:]]*404|404[[:space:]]+not found|(^|[[:space:]:])not found([[:space:]]|$)' <<<"$inspect_output"; then
              return 0
            fi
            printf '%s\n' "$inspect_output" >&2
            exit "$inspect_status"
          }

          verify_immutable_tag "${image}:${RELEASE_TAG}"
          verify_immutable_tag "${image}:${version}"
          docker buildx imagetools create --tag "${image}:${RELEASE_TAG}" "${image}@${digest}"
          docker buildx imagetools create --tag "${image}:${version}" "${image}@${digest}"
          [ "$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" | awk '$1 == "Digest:" {print $2; exit}')" = "$digest" ]
          [ "$(docker buildx imagetools inspect "${image}:${version}" | awk '$1 == "Digest:" {print $2; exit}')" = "$digest" ]
          if [ "$RELEASE_TAG" = "v5.4.1a" ]; then
            docker buildx imagetools create --tag "${image}:latest" "${image}@${digest}"
            [ "$(docker buildx imagetools inspect "${image}:latest" | awk '$1 == "Digest:" {print $2; exit}')" = "$digest" ]
          fi
