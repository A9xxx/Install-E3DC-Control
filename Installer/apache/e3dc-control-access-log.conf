# Diese Datei wird ausschließlich innerhalb des vom Installer gebundenen
# E3DC-Web-vHosts eingebunden. Erfolgreiche 2xx-Liveabfragen erzeugen keinen
# persistenten Access-Log-Eintrag: der gebündelte Live-POST, der read-only
# Wallbox-Snapshot und der read-only Watchdog-Status. Authentifizierungsfehler,
# Umleitungen, Serverfehler und sämtliche administrativen Endpunkte bleiben
# protokolliert.
CustomLog ${APACHE_LOG_DIR}/access.log combined "expr=!(%{REQUEST_STATUS} >= 200 && %{REQUEST_STATUS} < 300 && ((%{REQUEST_METHOD} == 'POST' && %{REQUEST_URI} == '/get_live_json.php') || (%{REQUEST_METHOD} == 'GET' && %{REQUEST_URI} == '/get_live_json.php' && %{QUERY_STRING} =~ m#(^|&)wallbox_native_snapshot=1(&|$)#) || (%{REQUEST_METHOD} == 'GET' && (%{REQUEST_URI} == '/index.php' || %{REQUEST_URI} == '/mobile.php') && %{QUERY_STRING} =~ m#(^|&)action=watchdog_status(&|$)#)))"
