# Laufzeitdaten dürfen ausschließlich serverseitig über die geprüften
# PHP-Endpunkte gelesen werden. Insbesondere e3dc_v4.json enthält Geheimnisse.
<Directory "/var/www/html/data">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/logs">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/ramdisk">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/tmp">
    AllowOverride None
    Require all denied
</Directory>

# Alte Installationen können Verlaufsbackups noch direkt im DocumentRoot
# erhalten. Dieser Migrationspfad ist ebenso privat wie data/history_backups.
<Directory "/var/www/html/history_backups">
    AllowOverride None
    Require all denied
</Directory>

# Historische Laufzeit-, Metadaten- und Konfigurationsspiegel liegen direkt im
# DocumentRoot und dürfen ebenfalls nie als statische Dateien ausgeliefert
# werden.
<FilesMatch "^(live_history\.txt|e3dc_paths\.json|e3dc\.(config|strompreise)\.txt|e3dc\.wallbox\.(txt|out))$">
    Require all denied
</FilesMatch>
