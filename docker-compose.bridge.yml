# Optionaler Bridge-Betrieb für geprüfte Installationen ohne Matter/mDNS
# oder Host-Loopback-Abhängigkeiten. Siehe doc/Docker_Dokumentation.md.
# Für den Betrieb bewusst als docker-compose.yml übernehmen; kein Override.
services:
  e3dc-control:
    # Ohne E3DC_IMAGE_TAG folgt die Installation dem geprüften Stable-Tag
    # "latest". Ein fester Pin oder Rückfall wird bewusst in .env gesetzt,
    # Es sind ausschließlich Images mit geprüfter Bridge-Unterstützung zulässig.
    image: "ghcr.io/a9xxx/install-e3dc-control:${E3DC_IMAGE_TAG:-latest}"

    # Lokaler Entwickler-Selbstbau mit getrenntem Compose-Override:
    # siehe doc/Docker_Dokumentation.md#optionaler-entwickler-selbstbau.

    container_name: e3dc-control
    hostname: e3dc-control
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - e3dc
    ports:
      - "${E3DC_PUBLISH_BIND:-127.0.0.1}:${E3DC_PUBLISH_PORT:-8085}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Watchtower aktualisiert diesen Container nur, wenn das Profil
      # "auto-update" läuft. Mit E3DC_WATCHTOWER_ENABLE=false in .env bleibt
      # der Container auch dann ausgenommen.
      - com.centurylinklabs.watchtower.enable=${E3DC_WATCHTOWER_ENABLE:-true}

    volumes:
      # PERSISTENTE DATEN (Konfiguration, SQLite, Backups)
      - e3dc_data:/var/www/html/data

      # LOGS (persistent, aber nicht im Repo)
      - e3dc_logs:/var/www/html/logs

      # Privater, anlagenspezifischer ML-Modellstore (nicht webschreibbar)
      - e3dc_ml:/var/lib/e3dc-control/ml

      # Private Rohdaten der PV-Prognosediagnose (nur bei Aktivierung genutzt)
      - e3dc_forecast_evidence:/var/lib/e3dc-control/forecast-evidence

      # Root-privater create-once-Anker: Docker bleibt dauerhaft Standalone.
      - e3dc_instance_role:/etc/e3dc-control

    tmpfs:
      # RAM-Disk für Live-Daten (pv_forecast.json, live_data_py.json, ...)
      - /var/www/html/ramdisk:size=64M,uid=33,gid=33,mode=2775

    environment:
      - TZ=Europe/Berlin
      - E3DC_CONTAINER_MODE=1
      - E3DC_CONTAINER_NETWORK_MODE=bridge
      # Update-Knopf und Auto-Update der Weboberfläche geben Watchtower über
      # dessen HTTP-API im gemeinsamen Bridge-Netz das Signal. Das Token wird
      # in .env gesetzt (siehe doc/Docker_Dokumentation.md, Abschnitt "Updates").
      - E3DC_WATCHTOWER_API_URL=http://watchtower:8080
      - E3DC_WATCHTOWER_API_TOKEN=${E3DC_WATCHTOWER_API_TOKEN:-}
      # Apache bleibt intern auf Port 80. Den äußeren Port und die
      # Host-IP setzen E3DC_PUBLISH_PORT / E3DC_PUBLISH_BIND in .env.

  watchtower:
    # containrrr/watchtower ist seit Dezember 2025 archiviert. Der gepflegte
    # Fork ist label- und umgebungskompatibel; der Major-Tag "1" schützt vor
    # der angekündigten Konfigurationsänderung in Watchtower 2.
    image: ghcr.io/nicholas-fedor/watchtower:1
    container_name: watchtower
    restart: unless-stopped
    # Im Bridge-Betrieb liegt die HTTP-API nur im gemeinsamen Compose-Netz;
    # sie wird nicht auf dem Host veröffentlicht.
    networks:
      - e3dc
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    profiles:
      - auto-update
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Berlin
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      # Watchtower handelt nur auf Signal von E3DC-Control: Update-Knopf oder
      # Auto-Update zur im Config-Editor eingestellten Uhrzeit. Keine eigene
      # Zeitsteuerung, damit die Entscheidung in der Weboberfläche liegt.
      - WATCHTOWER_HTTP_API_ENDPOINTS=update
      - WATCHTOWER_HTTP_API_PORT=8080
      - WATCHTOWER_HTTP_API_TOKEN=${E3DC_WATCHTOWER_API_TOKEN:-}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false

volumes:
  e3dc_data:
  e3dc_logs:
  e3dc_ml:
  e3dc_forecast_evidence:
  e3dc_instance_role:

networks:
  e3dc:
    driver: bridge
